<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>הדגמה בטלפון | הסטודיו של תמימה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <main class="stage">
    <section class="side" aria-label="מעבר בין מסכים">
      <p class="eyebrow">הדגמה</p>
      <h1>הסטודיו של תמימה</h1>
      <p class="lead">אתר, ניהול ואפליקציה לסטודנטים. הכול מסונכרן, מכל טלפון.</p>
      <nav class="jump" aria-label="מסכים">
        <button type="button" data-go="#/client"><b>האתר ללקוח</b><small>הזמנת סדנה והרשמה לקורס</small></button>
        <button type="button" data-go="#/tamima/home"><b>תמימה</b><small>מה מחכה לטיפול היום</small></button>
        <button type="button" data-go="#/tamima/calendar"><b>היומן</b><small>חוגים, סדנאות ומועדים פתוחים</small></button>
        <button type="button" data-go="#/tamima/classes"><b>חוגים ונוכחות</b><small>סימון נוכחות וכרטיסייה</small></button>
        <button type="button" data-go="#/student/home"><b>אפליקציית הסטודנט</b><small>השיעור הבא, ביטול והשלמה</small></button>
      </nav>
      <button type="button" class="reset" id="resetDemo">התחלה מחדש</button>
    </section>
    <div class="phone-box">
      <div class="phone" id="phone">
        <div class="notch" aria-hidden="true"></div>
        <div class="screen-wrap">
          <div class="status" aria-hidden="true"><span id="clock">9:41</span><span>5G ▮▮▮</span></div>
          <iframe id="screen" src="demo-app.html#/client" title="הדמו בטלפון"></iframe>
        </div>
      </div>
    </div>
  </main>
  <script src="phone.js"></script>
</body>
</html>
