<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    מדיניות אבטחת תוכן (CSP): הדפדפן מריץ קוד רק מהאתר עצמו ומחלון ההתחברות של גוגל,
    ומתחבר רק ל-Google Calendar API. אין סקריפטים מוטבעים ואין eval.
    style-src כולל 'unsafe-inline' רק בגלל מאפייני style של מיקום פריטים ביומן.
    כותרות שאי אפשר להגדיר ב-meta (frame-ancestors, HSTS) מפורטות במסך "תאימות ואבטחה".
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://gmail.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>הדגמה | הסטודיו של תמימה</title>
  <meta name="description" content="הדגמה של מערכת הסטודיו.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#221b16">
  <link rel="preload" as="image" href="img/hands-clay.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-app="demo">
  <a class="skip-link" href="#main">דלג לתוכן הראשי</a>
  <div id="demobar" role="region" aria-label="סרגל הדמו">
    <nav class="roles" aria-label="בחירת מבט">
      <a href="#/client" data-role="client">לקוח</a>
      <a href="#/tamima/home" data-role="tamima">תמימה</a>
      <a href="#/student/home" data-role="student">סטודנט</a>
    </nav>
    <label class="switch">
      <input type="checkbox" id="guidedToggle" aria-label="הדגמה מודרכת">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="sw-txt">הדגמה מודרכת</span><span class="sw-short" aria-hidden="true">מודרך</span>
    </label>
    <span id="clockLbl" class="clock-lbl" aria-live="polite"></span>
    <div class="tools">
      <button id="toolsBtn" class="bar-btn" type="button" aria-expanded="false" aria-controls="toolsMenu" aria-haspopup="true">כלים</button>
      <div id="toolsMenu" class="tools-menu" hidden>
        <button class="x-btn" type="button" aria-label="סגירת התפריט">×</button>
        <a href="#/compliance" data-role="compliance">תאימות ואבטחה</a>
        <button id="advBtn" type="button">קדם זמן ביום</button>
        <button id="failRefundBtn" type="button">הדגמה: הזיכוי הבא ייכשל</button>
        <button id="resetBtn" type="button">איפוס הדמו</button>
      </div>
    </div>
  </div>
  <div id="layout">
    <div id="app"></div>
    <aside id="guide" aria-label="מה קורה מאחורי הקלעים"></aside>
  </div>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="gcal.js"></script>
  <script src="data.js"></script>
  <script src="gsync.js"></script>
  <script src="core.js"></script>
  <script src="sumit.js"></script>
  <script src="site.js"></script>
  <script src="studio.js"></script>
  <script src="student.js"></script>
  <script src="demo.js"></script>
  <script src="boot.js"></script>
</body>
</html>
